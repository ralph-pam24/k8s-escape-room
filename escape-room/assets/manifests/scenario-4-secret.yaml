# =====================================================================
# Scenario 4 - Security Vault (Secret)
# Bug: vault-client mounts Secret "vault-creds" which does not exist
#      -> CreateContainerConfigError.
# Fix: Change secretName to "vault-credentials".
# Reward code: LEVEL5-GRANTED-XR
# Startup logic + reward live in ConfigMaps so nothing sensitive shows
# in `kubectl describe deploy` or `kubectl get secrets`.
# =====================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: security
---
apiVersion: v1
kind: Secret
metadata:
  name: vault-credentials
  namespace: security
type: Opaque
stringData:
  username: "admin"
  password: "level5-badge"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-ca-bundle
  namespace: security
data:
  ca.crt: |2

    =========================================================
                  SECURITY VAULT - LEVEL 5 BADGE
    =========================================================

     Access granted. Level 5 Security Badge retrieved.

     In Kubernetes, a Secret stores sensitive data such as
     usernames, passwords, API keys, and tokens. Values are
     base64-encoded but NOT encrypted. Pods consume Secrets
     through mounted volumes or environment variables. When
     a Secret is misreferenced, the pod fails to start with
     a CreateContainerConfigError.

     ---------------------------------------------------------
                  CODE: LEVEL5-GRANTED-XR
     ---------------------------------------------------------

     Copy the CODE WORD above and paste it into the browser
     game to unlock the next room.

     Click Next Step below after clicking CHECK to enter
     Room 5.

    =========================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-init-scripts
  namespace: security
data:
  init.sh: |
    #!/bin/sh
    TS() { date -u '+%Y-%m-%dT%H:%M:%SZ'; }
    mkdir -p /vault
    cp /scripts/open.sh /vault/open
    chmod +x /vault/open
    echo "$(TS) INFO  vault-client v2.4.1 initializing"
    echo "$(TS) INFO  Loading credentials from /etc/vault"
    echo "$(TS) INFO  Authentication module loaded"
    echo "$(TS) INFO  Session engine ready"
    echo "$(TS) INFO  READY"
    echo ""
    echo "To retrieve the Level 5 Security Badge, run the following"
    echo "command using the credentials stored in the vault-credentials Secret:"
    echo ""
    echo "  kubectl -n security exec deploy/vault-client -- /vault/open <username> <password>"
    echo ""
    sleep infinity
  open.sh: |
    #!/bin/sh
    U="$1"; P="$2"
    EU=$(cat /etc/vault/username)
    EP=$(cat /etc/vault/password)
    if [ -z "$U" ] || [ -z "$P" ]; then
      echo "Usage: /vault/open <username> <password>"
      exit 1
    fi
    if [ "$U" = "$EU" ] && [ "$P" = "$EP" ]; then
      cat /bundle/ca.crt
    else
      echo "Authentication failed. Use the credentials stored in the vault-credentials Secret."
      exit 1
    fi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-client
  namespace: security
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault-client
  template:
    metadata:
      labels:
        app: vault-client
    spec:
      containers:
        - name: client
          image: busybox:1.36
          command: ["sh", "/scripts/init.sh"]
          volumeMounts:
            - name: creds
              mountPath: /etc/vault
              readOnly: true
            - name: bundle
              mountPath: /bundle
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: creds
          secret:
            secretName: vault-creds        # BUG: wrong name (does not exist)
        - name: bundle
          configMap:
            name: vault-ca-bundle
        - name: scripts
          configMap:
            name: vault-init-scripts