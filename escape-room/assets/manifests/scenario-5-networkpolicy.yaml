# =====================================================================
# Scenario 5 - Security Gate Control Panel (NetworkPolicy)
# Bug: NetworkPolicy "exit-door-lockdown" denies all ingress to the
#      exit-door pod, so control-panel cannot reach it.
# Fix: Allow ingress to app=exit-door from app=control-panel on TCP
#      5678 (or delete the policy).
# Reward code: EXIT-UNLOCK-OMEGA  (delivered over the network)
# NOTE: Cilium (Killercoda default) enforces NetworkPolicy natively.
# =====================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: exit
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: exit-door-content
  namespace: exit
data:
  index.html: |2

    =========================================================
                  SECURITY GATE - FINAL EXIT DOOR
    =========================================================

     ALL FACILITY SYSTEMS RESTORED.
     The exit door controller is now reachable.

     In Kubernetes, a NetworkPolicy controls which pods may
     communicate. It acts as a firewall at the pod level.
     Even when applications are healthy and Services are
     correct, a restrictive NetworkPolicy can block all
     traffic. Allowing the required ingress restores
     communication between pods.

     ---------------------------------------------------------
                  CODE: EXIT-UNLOCK-OMEGA
     ---------------------------------------------------------

     Copy the CODE WORD above and paste it into the browser
     game to escape the facility.

     Congratulations - you have escaped the Kubernetes
     facility!

    =========================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exit-door
  namespace: exit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exit-door
  template:
    metadata:
      labels:
        app: exit-door
    spec:
      containers:
        - name: door
          image: busybox:1.36
          command: ["busybox", "httpd", "-f", "-p", "5678", "-h", "/www"]
          ports:
            - containerPort: 5678
          volumeMounts:
            - name: content
              mountPath: /www
              readOnly: true
      volumes:
        - name: content
          configMap:
            name: exit-door-content
---
apiVersion: v1
kind: Service
metadata:
  name: exit-door
  namespace: exit
spec:
  selector:
    app: exit-door
  ports:
    - port: 80
      targetPort: 5678
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-panel
  namespace: exit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: control-panel
  template:
    metadata:
      labels:
        app: control-panel
    spec:
      containers:
        - name: panel
          image: curlimages/curl:8.4.0
          command:
            - sh
            - -c
            - |
              TS() { date -u '+%Y-%m-%dT%H:%M:%SZ'; }
              echo "$(TS) INFO  control-panel v1.4.0 starting"
              echo "$(TS) INFO  Connecting to exit-door controller"
              while true; do
                RESP=$(curl -s --max-time 3 http://exit-door 2>/dev/null)
                if echo "$RESP" | grep -q "EXIT-UNLOCK-OMEGA"; then
                  echo "$(TS) INFO  Connection established with exit-door"
                  echo "$(TS) INFO  Exit door controller responded"
                  echo ""
                  echo "$RESP"
                  sleep infinity
                fi
                echo "$(TS) ERROR Cannot reach exit-door controller: connection timed out"
                sleep 5
              done
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: exit-door-lockdown
  namespace: exit
spec:
  podSelector:
    matchLabels:
      app: exit-door
  policyTypes:
    - Ingress
  ingress: []